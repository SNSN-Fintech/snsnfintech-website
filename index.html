<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNSN Fintech | Mortgage Broker Melbourne & Australia</title>
    <meta name="description" content="SNSN Fintech - Melbourne-based mortgage broker serving all of Australia. Our expert mortgage brokers compare 40+ lenders to find you the best home loan rates." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load fonts non-render-blocking with display=swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- DNS prefetch for any external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Inline critical CSS for instant first paint -->
    <style>
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1e293b;line-height:1.6;background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
      #root{min-height:100vh}
      .header{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1rem 0}
      .hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
      .hero__bg{position:absolute;inset:0;background:linear-gradient(160deg,#050d1a 0%,#0f2b4a 40%,#1a4a7a 100%);z-index:-2}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
